# 3. L'Arbre de Craft (Wiki)
wiki_tree:
  title: "&8» &6Arbre"
  size: 54
  background:
    material: STAINED_GLASS_PANE
    data: 15
    name: " "
  pagination:
    up_slot: 45
    up_item:
      hdb: 9220
      name: "&e▲ Défiler vers le haut"
    down_slot: 53
    down_item:
      hdb: 9227
      name: "&e▼ Défiler vers le bas"
    left_slot: 47
    left_item:
      hdb: 9226
      name: "&e◀ Défiler vers la gauche"
    right_slot: 51
    right_item:
      hdb: 9223
      name: "&e▶ Défiler vers la droite"

  # NOUVEAU : Formatage complet des crafts dans le Wiki
  craft_format:
    lore_header: "&8&m-----------------------"
    lore_cost: " &7• &f%amount% %item%"
    lore_free: " &7• &aGratuit"
    lore_footer: "&8&m-----------------------"

  # NOUVEAU : Statuts des items
  statuses:
    unlocked:
      prefix: "&a&l✔ &aDébloqué"
      lore_append:
        - "&7Méthode : &f%method%"
    unlockable:
      prefix: "&e&l! &ePrêt à débloquer"
      lore_append:
        - "&a► Cliquez pour acheter"
    locked_parents:
      prefix: "&c&l✖ &cParents Requis"
      lore_append: []
    locked_resources:
      prefix: "&6&l$ &6Ressources Insuffisantes"
      lore_append: []