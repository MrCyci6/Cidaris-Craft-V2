  # ==========================================
  magic_wand:
    name: "Baguette d'Apprenti"
    rarity: "commun"
    gui:
      x: 0
      y: -2
    parents: []
    costs:
      - type: MONEY
        amount: 50
    commands:
      - "[console] lp user %player% permission set craft.magic_wand"
      - "msg %player% &bVous sentez la magie couler en vous..."

  fire_spell:
    name: "Tome de Feu"
    rarity: "rare"
    gui:
      x: -2 # Part vers le haut-gauche
      y: -3
    parents: [magic_wand]
    costs:
      - type: MONEY
        amount: 200
    commands:
      - "[console] lp user %player% permission set craft.fire_spell"

  water_spell:
    name: "Tome d'Eau"
    rarity: "rare"
    gui:
      x: 2 # Part vers le haut-droite
      y: -3
    parents: [magic_wand]
    costs:
      - type: MONEY
        amount: 200
    commands:
      - "[console] lp user %player% permission set craft.water_spell"

  archmage_staff:
    name: "Bâton de l'Archimage"
    rarity: "legendaire"
    gui:
      x: 0
      y: -5 # Continue tout droit vers le haut
    parents: [fire_spell, water_spell] # Rejoint les deux côtés !
    costs:
      - type: MONEY
        amount: 1500
    commands:
      - "[console] lp user %player% permission set craft.archmage_staff"
      - "broadcast &d%player% &5est devenu un Archimage !"

