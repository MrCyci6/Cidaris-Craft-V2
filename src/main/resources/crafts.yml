# ==========================================
#        CIDARIS CRAFT - Tech Tree
# ==========================================

crafts:
  # ==========================================
  # BRANCHE A : COMBAT (Centre - Colonne 4)
  # ==========================================
  opale_sword:
    name: "Épée en opale"
    gui:
      column: 4
      tier: 0
    parents: []
    costs:
      - type: MONEY
        amount: 100
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 5
    commands:
      - "lp user %player% permission set craft.opale_sword"
      - "msg %player% &aVous savez désormais forger l'Épée en opale !"

  opale_helmet:
    name: "Casque en opale"
    gui:
      column: 4
      tier: 1
    parents: [opale_sword]
    costs:
      - type: MONEY
        amount: 150
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 8
    commands:
      - "lp user %player% permission set craft.opale_helmet"

  opale_chestplate:
    name: "Plastron en opale"
    gui:
      column: 4
      tier: 2
    parents: [opale_helmet]
    costs:
      - type: MONEY
        amount: 300
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 15
    commands:
      - "lp user %player% permission set craft.opale_chestplate"

  opale_leggings:
    name: "Jambières en opale"
    gui:
      column: 4
      tier: 3
    parents: [opale_chestplate]
    costs:
      - type: MONEY
        amount: 250
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 12
    commands:
      - "lp user %player% permission set craft.opale_leggings"

  opale_boots:
    name: "Bottes en opale"
    gui:
      column: 4
      tier: 4
    parents: [opale_leggings]
    costs:
      - type: MONEY
        amount: 100
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 5
    commands:
      - "lp user %player% permission set craft.opale_boots"
      - "broadcast &6%player% &evient de débloquer l'armure complète en Opale !"

  # ==========================================
  # BRANCHE B : EXTRACTION (Gauche - Colonne 1 & 2)
  # ==========================================
  opale_pickaxe:
    name: "Pioche en opale"
    gui:
      column: 2
      tier: 1
    parents: [opale_sword]
    costs:
      - type: MONEY
        amount: 150
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 8
    commands:
      - "lp user %player% permission set craft.opale_pickaxe"

  opale_drill:
    name: "Foreuse Thermique"
    gui:
      column: 1
      tier: 2
    parents: [opale_pickaxe]
    costs:
      - type: MONEY
        amount: 500
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 20
    commands:
      - "lp user %player% permission set craft.opale_drill"
      - "lp user %player% permission set use.drill"

  opale_excavator:
    name: "Excavatrice de l'Abîme"
    gui:
      column: 1
      tier: 3
    parents: [opale_drill]
    costs:
      - type: MONEY
        amount: 1500
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 64
    commands:
      - "lp user %player% permission set craft.opale_excavator"

  # ==========================================
  # BRANCHE C : TECHNOLOGIE (Droite - Colonne 6 & 7)
  # ==========================================
  basic_core:
    name: "Noyau d'Énergie"
    gui:
      column: 6
      tier: 1
    parents: [opale_sword]
    costs:
      - type: MONEY
        amount: 200
    commands:
      - "lp user %player% permission set craft.basic_core"

  opale_jetpack:
    name: "Jetpack en Opale"
    gui:
      column: 7
      tier: 2
    parents: [basic_core]
    costs:
      - type: MONEY
        amount: 1000
      - type: CUSTOM_ITEM
        id: "basic_core"
        amount: 2
    commands:
      - "lp user %player% permission set craft.opale_jetpack"
      - "lp user %player% permission set cidaris.jetpack.fly"

  opale_omnitools:
    name: "Omni-Tools de Cidaris"
    gui:
      column: 6
      tier: 3
    parents: [opale_jetpack]
    costs:
      - type: MONEY
        amount: 5000
      - type: CUSTOM_ITEM
        id: "opale"
        amount: 32
    commands:
      - "lp user %player% permission set craft.opale_omnitools"

  # ==========================================
  # BRANCHE D : UTILITAIRE (Tiers 5+)
  # ==========================================
  teleport_staff:
    name: "Bâton de Téléportation"
    gui:
      column: 4
      tier: 5
    parents: [opale_boots, opale_omnitools]
    costs:
      - type: MONEY
        amount: 10000
    commands:
      - "lp user %player% permission set craft.teleport_staff"
      - "lp user %player% permission set essentials.tpa"